<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude Observer</title><link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;--bg:#111316;--panel:#191c20;--line:#30343a;--muted:#979fa9;--text:#eceeea;--green:#acd6bb;--accent:#e6af8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{color:inherit}header{padding:25px 32px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px}.brand{font-size:21px;font-weight:650;letter-spacing:-.5px}.brand span{color:var(--accent)}.eyebrow{color:var(--muted);font-size:10px;letter-spacing:1.8px;font-weight:600}.status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px}.layout{display:grid;grid-template-columns:255px minmax(360px,1fr) 340px;min-height:calc(100vh - 91px)}aside{padding:23px 16px;border-right:1px solid var(--line)}main{padding:28px 30px}.detail{border-left:1px solid var(--line);padding:27px 23px;min-width:0}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.count{background:#30343a;color:#bcc2ca;border-radius:5px;padding:0 6px;font-size:11px}input,select{width:100%;background:#202329;border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:7px;outline:none}input:focus,select:focus{border-color:var(--accent)}select{margin-top:8px}.session{background:none;border:1px solid transparent;border-radius:8px;width:100%;text-align:left;padding:12px;margin-top:8px;display:block}.session:hover{background:#1d2025}.session.selected{background:#292621;border-color:#66503e}.session strong{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session small{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session .state{font-size:10px;margin-top:6px;color:var(--green)}h1{margin:4px 0 5px;font-size:26px;font-weight:550;letter-spacing:-.8px;overflow-wrap:anywhere}h2{font-size:17px;font-weight:550;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.metrics{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.metric{border:1px solid var(--line);padding:8px 13px;border-radius:7px;color:var(--muted);font-size:12px}.metric b{color:var(--text);font-size:18px;margin-right:7px;font-weight:500}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:24px 0 18px;gap:10px}.toggle{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}.toggle input{width:auto;accent-color:var(--accent)}.node{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:11px;cursor:pointer;position:relative}.node:hover{border-color:#68717c}.node.chosen{border-color:var(--accent)}.node.root{border-top:2px solid var(--accent)}.children{border-left:1px solid #41464d;margin-left:19px;padding-left:22px}.node-top{display:flex;gap:8px;align-items:center;justify-content:space-between}.node-title{font-size:14px;font-weight:550;overflow-wrap:anywhere}.badge{border:1px solid #435249;color:var(--green);border-radius:4px;padding:1px 6px;font-size:10px;white-space:nowrap}.badge.completed,.badge.idle,.badge.response-ended{border-color:#454b54;color:#a2aab4}.badge.unknown,.badge.observed{border-color:#5c5140;color:#d7bf90}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{font:11px/1.7 ui-monospace,SFMono-Regular,monospace;background:#24282e;border-radius:4px;padding:2px 7px;color:#c8d2e1}.tag.effort{color:var(--accent)}.activity{color:var(--muted);font-size:12px;margin:10px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.detail-label{color:var(--muted);font-size:11px;margin:23px 0 7px}.prose{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.value{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;overflow-wrap:anywhere}.source{font-size:10px;color:var(--muted);margin-top:4px}.event{border-left:1px solid var(--line);padding:0 0 18px 12px;font-size:11px;overflow-wrap:anywhere}.event time{display:block;color:var(--muted);font-size:10px}.quiet{color:var(--muted);font-size:12px}.error{color:#e9b78f;border:1px solid #705541;border-radius:7px;padding:12px;margin-bottom:15px;font-size:12px;white-space:pre-wrap}.empty{border:1px dashed var(--line);padding:40px 22px;border-radius:10px;color:var(--muted);text-align:center}.refresh{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 10px;font-size:11px}.footer{margin-top:30px;color:var(--muted);font-size:10px;line-height:1.8}.relation{font-size:10px;color:var(--accent);margin-bottom:8px}.detail-id{font-size:10px;overflow-wrap:anywhere;color:var(--muted)}@media(min-width:1450px){.layout{grid-template-columns:270px minmax(360px,1fr) 400px}}@media(max-width:1100px){.layout{grid-template-columns:225px 1fr}.detail{grid-column:2;border-top:1px solid var(--line)}aside{grid-row:1/3}header{padding:20px}.status{font-size:10px}main{padding:24px}}@media(max-width:650px){.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}.detail{border-left:0}header{flex-wrap:wrap;gap:8px}.status{margin-left:0;width:100%}h1{font-size:22px}.children{margin-left:8px;padding-left:12px}}
</style></head><body>
<header><div class="brand"><span>◈</span> Claude Observer</div><div class="eyebrow">LOCAL AGENT ACTIVITY</div><div class="status" id="sync" role="status">수집 중…</div><button class="refresh" id="refresh">새로고침</button></header>
<div class="layout"><aside><div class="section-title"><span class="eyebrow">SESSIONS</span><span class="count" id="session-count">0</span></div><input id="search" aria-label="세션 검색" placeholder="세션 · 프로젝트 검색"><select id="project" aria-label="프로젝트 필터"><option value="">모든 프로젝트</option></select><div id="sessions"></div><div class="footer">READ ONLY · 127.0.0.1<br>2초마다 로컬 기록 갱신<br>요청값과 관측값을 분리해 표시합니다.<br>주변 세션은 독립된 세션으로 표시합니다.</div></aside>
<main><div id="errors" role="alert"></div><div class="eyebrow">ORCHESTRATION</div><h1 id="title">실행 중인 세션 찾는 중</h1><div class="sub" id="cwd"></div><div class="metrics" id="metrics"></div><div class="toolbar"><span class="eyebrow">AGENT TREE</span><label class="toggle"><input type="checkbox" id="completed">완료 에이전트 표시</label></div><div id="tree"></div></main>
<section class="detail" aria-label="선택한 에이전트 상세"><div class="eyebrow">INSPECTOR</div><div id="detail"><p class="quiet">카드를 선택하면 작업과 근거를 볼 수 있습니다.</p></div></section></div>
<script>
const $=id=>document.getElementById(id), state={data:null,session:localStorage.getItem('observer.session'),node:null,pending:false};
const labels={busy:'작업 중',idle:'입력 대기',completed:'완료','response-ended':'응답 종료',observed:'활동 관측',unknown:'미확인'};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function date(t){if(!t)return '시각 미기록';const d=new Date(typeof t==='number'&&t<1e12?t*1000:t);return isNaN(d)?String(t):d.toLocaleTimeString('ko-KR',{hour12:false})}
function model(n){return n.model||n.responseModel}
function field(parent,label,value,source){parent.append(el('div','detail-label',label),el('div','value',value||'미확인'));if(source)parent.append(el('div','source',source))}
function inspect(n){const d=$('detail');d.replaceChildren();if(!n){d.append(el('p','quiet','카드를 선택하세요.'));return}d.append(el('h2','',n.name),el('div','detail-id',n.id),el('span','badge '+n.status,labels[n.status]||n.status));field(d,'모델 · 최신 API 요청',n.model?.value,n.model&&n.model.source+' · '+date(n.model.at));field(d,'모델 · 최신 응답',n.responseModel?.value,n.responseModel&&n.responseModel.source+' · '+date(n.responseModel.at));field(d,'EFFORT · 관측값',n.effort?.value,n.effort&&n.effort.source+' · '+date(n.effort.at));if(n.kind==='agent'){field(d,'생성 시 요청 모델 / EFFORT',(n.requestedModel||'미기록')+' / '+(n.requestedEffort||'미기록'),'Agent 호출 또는 .meta.json · 실제 관측값과 다를 수 있음');field(d,'에이전트 유형',n.agentType);field(d,'부모 연결',n.parentId?'toolUseId 일치':'부모 미확인')}d.append(el('div','detail-label','작업 / 최근 요청'),el('div','prose',n.task||n.name));d.append(el('div','detail-label','최근 활동'));for(const event of [...n.events].reverse()){const e=el('div','event',event.text);e.prepend(el('time','',date(event.at)));d.append(e)}if(!n.events.length)d.append(el('p','quiet','아직 활동 기록이 없습니다.'));d.append(el('p','quiet','“활동 관측”은 기록이 있다는 뜻이며 현재 실행 여부는 미확인입니다. 모델과 effort는 표시된 시각의 관측값입니다.'))}
function render(){const data=state.data;if(!data)return;const query=$('search').value.toLowerCase(),proj=$('project').value;const sessions=data.sessions.filter(s=>(!proj||s.cwd===proj)&&(!query||(s.name+' '+s.cwd).toLowerCase().includes(query)));$('session-count').textContent=data.sessions.length;
if(!sessions.some(s=>s.id===state.session))state.session=sessions.find(s=>s.status==='busy')?.id||sessions[0]?.id;const s=data.sessions.find(s=>s.id===state.session);$('sessions').replaceChildren();for(const item of sessions){const b=el('button','session'+(item.id===state.session?' selected':''));b.append(el('strong','',item.name),el('small','',item.cwd),el('div','state',(labels[item.status]||item.status||'미확인')+' · PID '+item.pid));b.onclick=()=>{state.session=item.id;state.node=item.id;localStorage.setItem('observer.session',item.id);render()};$('sessions').append(b)}
$('title').textContent=s?.name||'실행 중인 세션 없음';$('cwd').textContent=s?.cwd||'Claude Code를 실행하면 세션이 여기에 표시됩니다.';const ns=data.nodes.filter(n=>n.sessionId===s?.id);$('metrics').replaceChildren();for(const [value,label] of [[ns.filter(n=>n.kind==='agent').length,'하위 에이전트'],[ns.filter(n=>n.status==='completed').length,'완료'],[ns.filter(n=>n.kind==='agent'&&n.status!=='completed').length,'기타 상태']]){const m=el('div','metric');m.append(el('b','',value),document.createTextNode(label));$('metrics').append(m)}
const show=$('completed').checked,root=$('tree');root.replaceChildren();const visited=new Set();function draw(n,container){if(visited.has(n.id))return;visited.add(n.id);const children=ns.filter(x=>x.parentId===n.id);if(!show&&n.status==='completed'&&!children.some(x=>x.status!=='completed'))return;const card=el('article','node'+(n.kind==='session'?' root':'')+(state.node===n.id?' chosen':''));card.tabIndex=0;card.setAttribute('role','button');const top=el('div','node-top');top.append(el('span','node-title',n.kind==='session'?'메인 · '+n.name:n.name),el('span','badge '+n.status,labels[n.status]||n.status));card.append(top);const tags=el('div','tags');tags.append(el('span','tag',model(n)?.value||('요청: '+(n.requestedModel||'모델 미확인'))),el('span','tag effort',n.effort?'effort '+n.effort.value:(n.requestedEffort?'요청 effort '+n.requestedEffort:'effort 미확인')));card.append(tags,el('p','activity',n.activity||n.task||'활동 기록 대기'));card.onclick=()=>{state.node=n.id;render()};card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.click()}};container.append(card);if(children.length){const branch=el('div','children');container.append(branch);children.forEach(c=>draw(c,branch))}}
ns.filter(n=>n.kind==='session').forEach(n=>draw(n,root));const unlinked=ns.filter(n=>!visited.has(n.id)&&(!n.parentId||!ns.some(p=>p.id===n.parentId)));if(unlinked.length){root.append(el('p','relation','세션 소속 · 부모 연결 미확인'));unlinked.forEach(n=>draw(n,root))}for(const n of ns)if(!visited.has(n.id))draw(n,root);if(!ns.length)root.append(el('div','empty','표시할 세션이 없습니다. 검색 또는 프로젝트 필터를 확인하세요.'));inspect(ns.find(n=>n.id===state.node)||ns.find(n=>n.kind==='session'));$('errors').replaceChildren();if(data.errors.length)$('errors').append(el('div','error','일부 기록을 읽지 못했습니다.\n'+data.errors.join('\n')))}
async function poll(){if(state.pending)return;state.pending=true;try{const response=await fetch('/api/snapshot');if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();state.data=data;const selected=$('project').value,paths=[...new Set(data.sessions.map(s=>s.cwd))].sort();$('project').replaceChildren(el('option','','모든 프로젝트'));$('project').firstChild.value='';for(const path of paths){const o=el('option','',path.split('/').pop()||path);o.value=path;$('project').append(o)}$('project').value=paths.includes(selected)?selected:'';render();$('sync').textContent='● 로컬 연결됨 · '+date(data.generatedAt);$('sync').style.color='var(--green)'}catch(e){$('sync').textContent='연결 오류 · 마지막 화면 유지 · '+e.message;$('sync').style.color='var(--accent)'}finally{state.pending=false}}
$('search').oninput=render;$('project').onchange=render;$('completed').onchange=render;$('refresh').onclick=poll;poll();setInterval(poll,2000);
</script></body></html>
